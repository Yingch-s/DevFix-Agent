[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devfix"
version = "0.1.0"
description = "CI failure diagnosis and repair agent for Java / Spring Boot projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
devfix = "devfix.cli:app"

[tool.setuptools.packages.find]
include = ["devfix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: 需要真实 LLM 调用的集成测试（需 DEVFIX_RUN_LLM_TESTS=1）",
]

[tool.ruff.lint]
# B008：Typer/FastAPI 的命令参数默认值本来就是“在签名里调用”
ignore = ["B008"]
